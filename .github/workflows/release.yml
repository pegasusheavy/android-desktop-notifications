name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop-linux:
    name: Build Desktop (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libnotify-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --manifest-path desktop/Cargo.toml --release

      - name: Package
        run: |
          mkdir -p dist
          cp desktop/target/release/notisync dist/
          cp notisync.desktop dist/
          cp notisync.svg dist/
          cp notisync.service dist/
          cp LICENSE dist/
          tar -czvf notisync-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notisync-linux-x86_64
          path: notisync-linux-x86_64.tar.gz

  build-desktop-windows:
    name: Build Desktop (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --manifest-path desktop/Cargo.toml --release

      - name: Package
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          mkdir dist
          Copy-Item desktop/target/release/notisync.exe dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath notisync-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notisync-windows-x86_64
          path: notisync-windows-x86_64.zip

  build-desktop-macos:
    name: Build Desktop (macOS x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --manifest-path desktop/Cargo.toml --release

      - name: Package
        run: |
          mkdir -p dist
          cp desktop/target/release/notisync dist/
          cp LICENSE dist/
          tar -czvf notisync-macos-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notisync-macos-x86_64
          path: notisync-macos-x86_64.tar.gz

  build-desktop-macos-arm:
    name: Build Desktop (macOS ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --manifest-path desktop/Cargo.toml --release --target aarch64-apple-darwin

      - name: Package
        run: |
          mkdir -p dist
          cp desktop/target/aarch64-apple-darwin/release/notisync dist/
          cp LICENSE dist/
          tar -czvf notisync-macos-aarch64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notisync-macos-aarch64
          path: notisync-macos-aarch64.tar.gz

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            devscripts \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libnotify-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build package
        run: |
          cp -r packaging/debian .
          chmod +x debian/rules debian/postinst debian/prerm
          dpkg-buildpackage -us -uc -b

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notisync-deb
          path: ../notisync_*.deb

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cp android/app/build/outputs/apk/debug/app-debug.apk notisync-${VERSION}-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk notisync-${VERSION}-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notisync-android-debug
          path: notisync-*-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: notisync-android-release
          path: notisync-*-release-unsigned.apk

  create-release:
    name: Create Release
    needs: [build-desktop-linux, build-desktop-windows, build-desktop-macos, build-desktop-macos-arm, build-deb, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/notisync-linux-x86_64/*.tar.gz
            artifacts/notisync-windows-x86_64/*.zip
            artifacts/notisync-macos-x86_64/*.tar.gz
            artifacts/notisync-macos-aarch64/*.tar.gz
            artifacts/notisync-deb/*.deb
            artifacts/notisync-android-debug/*.apk
            artifacts/notisync-android-release/*.apk
