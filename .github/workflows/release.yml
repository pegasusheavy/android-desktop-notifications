name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop-linux:
    name: Build Desktop (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libnotify-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --manifest-path desktop/Cargo.toml --release

      - name: Package
        run: |
          mkdir -p dist
          cp desktop/target/release/notisync dist/
          cp notisync.desktop dist/
          cp notisync.svg dist/
          cp notisync.service dist/
          cp LICENSE dist/
          tar -czvf notisync-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notisync-linux-x86_64
          path: notisync-linux-x86_64.tar.gz

  build-desktop-windows:
    name: Build Desktop (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --manifest-path desktop/Cargo.toml --release

      - name: Create icon
        shell: pwsh
        run: |
          # Create a simple ICO file from SVG (placeholder - use actual icon in production)
          # For now, we'll skip the icon requirement in WiX

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build MSI
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"

          # Create a simplified WiX file without icon
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
              <Package Name="NotiSync"
                       Version="$VERSION.0"
                       Manufacturer="Pegasus Heavy Industries LLC"
                       UpgradeCode="8B5E1A9C-4F2D-4E3B-9A1C-6D7E8F9A0B1C"
                       Scope="perUser">

                  <MajorUpgrade DowngradeErrorMessage="A newer version of NotiSync is already installed." />
                  <MediaTemplate EmbedCab="yes" />

                  <StandardDirectory Id="LocalAppDataFolder">
                      <Directory Id="INSTALLFOLDER" Name="NotiSync">
                          <Component Id="MainExecutable" Guid="*">
                              <File Id="NotiSyncExe" Source="desktop\target\release\notisync.exe" />
                          </Component>
                      </Directory>
                  </StandardDirectory>

                  <StandardDirectory Id="ProgramMenuFolder">
                      <Directory Id="ProgramMenuDir" Name="NotiSync">
                          <Component Id="StartMenuShortcut" Guid="*">
                              <Shortcut Id="StartMenuShortcut"
                                        Name="NotiSync"
                                        Target="[INSTALLFOLDER]notisync.exe"
                                        WorkingDirectory="INSTALLFOLDER" />
                              <RemoveFolder Id="ProgramMenuDir" On="uninstall" />
                              <RegistryValue Root="HKCU" Key="Software\NotiSync" Name="installed" Type="integer" Value="1" KeyPath="yes" />
                          </Component>
                      </Directory>
                  </StandardDirectory>

                  <StandardDirectory Id="StartupFolder">
                      <Component Id="StartupShortcut" Guid="*">
                          <Shortcut Id="StartupShortcut"
                                    Name="NotiSync"
                                    Target="[INSTALLFOLDER]notisync.exe"
                                    WorkingDirectory="INSTALLFOLDER" />
                          <RegistryValue Root="HKCU" Key="Software\NotiSync" Name="startup" Type="integer" Value="1" KeyPath="yes" />
                      </Component>
                  </StandardDirectory>

                  <Feature Id="Main">
                      <ComponentRef Id="MainExecutable" />
                      <ComponentRef Id="StartMenuShortcut" />
                      <ComponentRef Id="StartupShortcut" />
                  </Feature>
              </Package>
          </Wix>
          "@ | Out-File -FilePath "notisync.wxs" -Encoding UTF8

          wix build notisync.wxs -o notisync-windows-x86_64.msi

      - name: Package ZIP
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item desktop/target/release/notisync.exe dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath notisync-windows-x86_64.zip

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: notisync-windows-msi
          path: notisync-windows-x86_64.msi

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: notisync-windows-x86_64
          path: notisync-windows-x86_64.zip

  build-desktop-macos:
    name: Build Desktop (macOS Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --manifest-path desktop/Cargo.toml --release --target x86_64-apple-darwin

      - name: Build ARM64
        run: cargo build --manifest-path desktop/Cargo.toml --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create \
            desktop/target/x86_64-apple-darwin/release/notisync \
            desktop/target/aarch64-apple-darwin/release/notisync \
            -output notisync

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create App Bundle and DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_NAME="NotiSync"
          DMG_NAME="notisync-${VERSION}-macos-universal.dmg"

          # Create app bundle structure
          mkdir -p "${APP_NAME}.app/Contents/MacOS"
          mkdir -p "${APP_NAME}.app/Contents/Resources"

          # Copy universal binary
          cp notisync "${APP_NAME}.app/Contents/MacOS/"
          chmod +x "${APP_NAME}.app/Contents/MacOS/notisync"

          # Create Info.plist with correct version
          cat > "${APP_NAME}.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>notisync</string>
              <key>CFBundleIdentifier</key>
              <string>com.pegasusheavy.notisync</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>NotiSync</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSHumanReadableCopyright</key>
              <string>Copyright © 2024 Pegasus Heavy Industries LLC</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.utilities</string>
          </dict>
          </plist>
          EOF

          # Create DMG
          mkdir -p dmg_contents
          cp -r "${APP_NAME}.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          hdiutil create -volname "${APP_NAME}" \
              -srcfolder dmg_contents \
              -ov -format UDZO \
              "${DMG_NAME}"

          # Also create tar.gz for those who prefer it
          tar -czvf notisync-macos-universal.tar.gz -C dmg_contents "${APP_NAME}.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: notisync-macos-dmg
          path: notisync-*-macos-universal.dmg

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: notisync-macos-universal
          path: notisync-macos-universal.tar.gz

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            devscripts \
            build-essential \
            cargo \
            rustc \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libnotify-dev

      - name: Build package
        run: |
          cp -r packaging/debian .
          chmod +x debian/rules debian/postinst debian/prerm
          dpkg-buildpackage -us -uc -b
          # Move deb file to current directory for upload
          mv ../notisync_*.deb .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notisync-deb
          path: notisync_*.deb

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cp android/app/build/outputs/apk/debug/app-debug.apk notisync-${VERSION}-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk notisync-${VERSION}-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notisync-android-debug
          path: notisync-*-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: notisync-android-release
          path: notisync-*-release-unsigned.apk

  create-release:
    name: Create Release
    needs: [build-desktop-linux, build-desktop-windows, build-desktop-macos, build-deb, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/notisync-linux-x86_64/*.tar.gz
            artifacts/notisync-windows-x86_64/*.zip
            artifacts/notisync-windows-msi/*.msi
            artifacts/notisync-macos-dmg/*.dmg
            artifacts/notisync-macos-universal/*.tar.gz
            artifacts/notisync-deb/*.deb
            artifacts/notisync-android-debug/*.apk
            artifacts/notisync-android-release/*.apk
