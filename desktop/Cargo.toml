[package]
name = "notisync"
version = "0.1.0"
edition = "2021"
authors = ["Joseph Quinn <quinn.josephr@protonmail.com>"]
license = "MIT"
description = "Sync Android notifications to your desktop"
repository = "https://github.com/pegasusheavy/android-desktop-notifications"
keywords = ["notifications", "android", "sync", "desktop"]
categories = ["network-programming"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
mdns-sd = "0.11"
gethostname = "0.5"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
image = "0.25"
directories = "5"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
mockall = "0.12"
